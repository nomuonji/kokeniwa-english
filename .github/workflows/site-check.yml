name: Site build check

on:
  push:
    branches:
      - main
      - feature/reading-articles
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile site Python
        run: python -m compileall -q site
      - name: Build static site and check links
        run: python site/build_site.py

name: Instagram 連携

# Instagram 連携の状態確認と、アカウントごとの一時停止/再開。
# 紐づけ(トークン登録)は Threads と同じくローカルで行い、トークンは Gist にだけ保存する
# (Actions の Secret や入力にトークンを置かない)。手順は docs/セットアップ_Instagram自動投稿.md。

on:
  workflow_dispatch:
    inputs:
      action:
        description: "status / enable / disable"
        required: true
        default: "status"
        type: choice
        options: [status, enable, disable]
      account:
        description: 'Threads 側のアカウント名(例: uscpa, legal, reading, kotsukotsu)。status なら空でよい'
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: threads-autopost   # 自動投稿と同じ Gist を書くので同時実行させない
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 実行
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ACTION: ${{ github.event.inputs.action }}
          ACCOUNT: ${{ github.event.inputs.account }}
          PYTHONIOENCODING: "utf-8"
        run: python scripts/ig_link.py
